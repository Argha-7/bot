name: Instagram Auto Comment Bot

on:
  schedule:
    # Har 10 minute mein run hoga (GitHub minimum 5 min hai)
    - cron: '*/10 * * * *'
  
  # Manually bhi run kar sakte ho GitHub se
  workflow_dispatch:

jobs:
  post-comment:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Code checkout karo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python setup karo
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Dependencies install karo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Bot run karo (Secrets se credentials aayenge)
      - name: Run Instagram Comment Bot
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          POST_URL: ${{ secrets.POST_URL }}
          COMMENT_TEXT: ${{ secrets.COMMENT_TEXT }}
        run: |
          python instagram_bot.py
